# Cấu hình ngrok cho webhook SePay
# restart-server chạy:
# ngrok http 3000 --url https://amia-canelike-exhibitively.ngrok-free.dev
version: "2"
tunnels:
  default:
    addr: 3000
    proto: http
    # Thêm header để bypass trang cảnh báo ngrok (một số request từ server)
    request_header:
      add: ["ngrok-skip-browser-warning: true"]
