# Cấu hình Nginx cho NanoAI - timeout 5 phút cho API AI
# Cách 1: Dùng file mới (chưa có SSL thì chạy: sudo certbot --nginx -d nanoai.vn)
# Cách 2: Chỉ copy phần timeout + buffer vào location / của config hiện có

server {
    listen 80;
    server_name nanoai.vn www.nanoai.vn;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout 5 phút cho API AI (tạo ảnh, thử đồ...)
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;

        # Buffer cho request lớn (upload ảnh)
        client_max_body_size 50M;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_temp_file_write_size 256k;
    }
}
