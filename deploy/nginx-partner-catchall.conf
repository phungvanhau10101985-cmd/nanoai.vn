# Catch-all HTTP — domain shop CNAME về nanoai.vn (Host: shop.khach.com) proxy vào app.
# QUAN TRỌNG: site 188.com.vn KHÔNG được default_server redirect mọi Host lạ → 188.
# Copy lên VPS:
#   sudo cp deploy/nginx-partner-catchall.conf /etc/nginx/sites-available/nanoai-partner-catchall
#   sudo ln -sf /etc/nginx/sites-available/nanoai-partner-catchall /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        alias /var/www/certbot/.well-known/acme-challenge/;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
        client_max_body_size 50M;
    }
}
