# Catch-all HTTP — domain shop CNAME về nanoai.vn (Host: shop.khach.com) proxy vào app.
# QUAN TRỌNG: site 188.com.vn KHÔNG được default_server redirect mọi Host lạ → 188.
# Copy lên VPS:
#   sudo cp deploy/nginx-conf.d-nanoai.conf /etc/nginx/conf.d/nanoai.conf
#   sudo cp deploy/nginx-shop-locations.inc /etc/nginx/snippets/nanoai-shop-locations.inc
#   sudo mkdir -p /var/cache/nginx/nanoai-fetch-image
#   sudo cp deploy/nginx-partner-catchall.conf /etc/nginx/sites-available/nanoai-partner-catchall
#   sudo ln -sf /etc/nginx/sites-available/nanoai-partner-catchall /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    include /etc/nginx/snippets/nanoai-shop-locations.inc;
}
