# HTTP-level (copy → /etc/nginx/conf.d/nanoai.conf). gzip + keepalive + cache fetch-image.
# Không cache HTML shop. Vhost vẫn proxy HTML `no-store`.

gzip on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_proxied any;
gzip_vary on;
gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml
    image/svg+xml;

upstream nanoai_next {
    server 127.0.0.1:3000;
    keepalive 64;
}

proxy_cache_path /var/cache/nginx/nanoai-fetch-image
    levels=1:2
    keys_zone=nanoai_fetch_image:32m
    max_size=1g
    inactive=7d
    use_temp_path=off;
